<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — File Not Found | Your Name Portfolio</title>
  <meta name="description" content="The file you requested does not exist. Go back to the home page of the Your Name portfolio.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <!--
    Served at the missing URL itself, so all asset paths must be absolute
    from the site root (nginx and Docker both serve the site at /).
  -->
  <link rel="stylesheet" href="/assets/css/site.css?v=7">
</head>
<body class="page">
<a class="skip-link" href="#main">Skip to content</a>

  <div class="terminal-window">
    <div class="terminal-bar">
      <div class="terminal-dot dot-red" aria-hidden="true"></div>
      <div class="terminal-dot dot-yellow" aria-hidden="true"></div>
      <div class="terminal-dot dot-green" aria-hidden="true"></div>
      <span class="terminal-title">user@hostname:~/404</span>
    </div>
    <main class="terminal-body" id="main">
      <div><span class="prompt">$</span> <span class="cmd" id="cmd">cat 404.md</span><span class="cursor"></span></div>
      <article class="ff-content" id="content">
        <h1>File not found</h1>
        <p><span style="color:#ef4444;">cat:</span> <span id="missed-path"></span>: No such file or directory.</p>
        <a href="/" class="back-link">&lt; cd ~</a>
      </article>
    </main>
  </div>

  <script src="/src/js/js-yaml.min.js"></script>
  <script src="/src/js/config.js?v=9"></script>
  <script>
    (function () {
      var path = decodeURIComponent(location.pathname);
      var missed = document.getElementById('missed-path');
      var cmd = document.getElementById('cmd');

      if (path.slice(-1) === '/') path = path.slice(0, -1);
      if (missed) missed.textContent = path;
      if (cmd) cmd.textContent = 'cat ' + path + '.md';
    })();
  </script>
</body>
</html>
