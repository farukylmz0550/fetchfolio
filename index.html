<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>user@hostname:~/</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: 100%;
    }
    body {
      height: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0c0c0d;
      color: #e6e6e6;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Courier New", monospace;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 15% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
        radial-gradient(ellipse at 85% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 20%, rgba(250, 204, 21, 0.06) 0%, transparent 35%),
        radial-gradient(ellipse at 30% 80%, rgba(239, 68, 68, 0.05) 0%, transparent 35%);
      animation: wave 12s ease-in-out infinite;
      z-index: -1;
    }
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.03) 0%, transparent 60%);
      animation: pulse 8s ease-in-out infinite reverse;
      z-index: -1;
    }
    @keyframes wave {
      0% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(4%, -3%) scale(1.03); }
      50% { transform: translate(-3%, 4%) scale(0.97); }
      75% { transform: translate(3%, 1%) scale(1.02); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.5; transform: scale(1); }
    }
    .terminal-window {
      width: 800px;
      height: 480px;
      background: rgba(18, 19, 22, 0.92);
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .terminal-bar {
      background: #1e293b;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #eab308; }
    .dot-green { background: #22c55e; }
    .terminal-title {
      color: #64748b;
      font-size: 12px;
      margin-left: 8px;
    }
    .terminal-body {
      display: flex;
      flex-wrap: nowrap;
      gap: 30px;
      padding: 20px;
      align-items: flex-start;
      overflow-y: auto;
      flex: 1;
    }
    .ascii-art {
      color: #38bdf8;
      font-size: 7px;
      line-height: 1.0;
      white-space: pre;
      user-select: none;
      font-weight: bold;
      letter-spacing: 0px;
      flex-shrink: 0;
    }
    .fetch-info {
      font-size: 14px;
      line-height: 1.8;
      flex: 1;
      min-width: 280px;
    }
    .user-host {
      color: #38bdf8;
      font-weight: bold;
    }
    .separator {
      color: #4b5563;
      margin-bottom: 8px;
    }
    .nav-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
      padding: 3px 6px;
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
    }
    .nav-row:hover {
      background-color: #1e293b;
      transform: translateX(4px);
    }
    .key {
      color: #38bdf8;
      font-weight: bold;
      display: inline-block;
      min-width: 110px;
    }
    .value {
      color: #e2e8f0;
    }
    .nav-row:hover .value {
      color: #facc15;
      text-decoration: underline;
    }
    .social-links {
      display: flex;
      gap: 6px;
      margin-top: 16px;
      padding-left: 4px;
    }
    .social-box {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .social-box:hover {
      transform: scale(1.3);
      border-color: #38bdf8;
    }
    .social-box img {
      width: 14px;
      height: 14px;
    }
    .social-box.github { background: #000000; }
    .social-box.youtube { background: #ef4444; }
    .social-box.makerworld { background: #22c55e; }
    .social-box.gravatar { background: #3b82f6; }
    .social-box.yellow { background: #eab308; }
    .social-box.blue { background: #3b82f6; }
    .social-box.purple { background: #a855f7; }
    .social-box.white { background: #f8fafc; }
    .lang-btn {
      margin-left: auto;
      background: transparent;
      color: #64748b;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    @media (max-width: 900px) {
      .terminal-window { width: 100%; height: auto; min-height: 300px; }
      .terminal-body { flex-direction: column; padding: 16px; gap: 16px; }
      .ascii-art { font-size: 8px; }
      .fetch-info { font-size: 12px; }
      .key { min-width: 90px; }
    }
  </style>
</head>

  <script src="src/js/js-yaml.min.js"></script>

  <script>
    function toggleLang() {
      const newLang = getLang() === 'tr' ? 'en' : 'tr';
      setLang(newLang);
      applyTranslations();
      document.querySelector('.lang-btn').textContent = newLang.toUpperCase();
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const translation = t(key);
        if (translation) el.textContent = translation;
      });
    }

    document.querySelector('.lang-btn').textContent = getLang().toUpperCase();
    applyTranslations();
  </script>
