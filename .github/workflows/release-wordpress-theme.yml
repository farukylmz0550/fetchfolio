name: Release WordPress theme

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package theme
        id: package
        working-directory: wordpress-theme
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          zip -qr "$RUNNER_TEMP/fetchfolio-wordpress-theme-$VERSION.zip" fetchfolio

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/fetchfolio-wordpress-theme-${{ steps.package.outputs.version }}.zip
