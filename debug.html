<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fetchfolio DEBUG</title>
  <style>
    body { background:#111; color:#0f0; font-family: monospace; padding: 24px; white-space: pre-wrap; }
    .ok  { color: #22c55e; font-weight: bold; }
    .err { color: #ef4444; font-weight: bold; }
    .warn{ color: #eab308; font-weight: bold; }
    h2 { color:#fff; }
  </style>
</head>
<body>
<h2>fetchfolio debug — diagnostics (temporary page, safe to ignore)</h2>
<div id="out">running tests...</div>

<script src="src/js/js-yaml.min.js"></script>
<script src="src/js/config.js?v=6"></script>
<script>
(function () {
  const out = document.getElementById('out');
  const line = (cls, msg) => {
    const p = document.createElement('div');
    if (cls) p.className = cls;
    p.textContent = msg;
    out.appendChild(p);
  };
  const H = (ok, msgOk, msgErr) => line(ok ? 'ok' : 'err', (ok ? '[OK]  ' : '[FAIL] ') + (ok ? msgOk : msgErr));

  try {
    line('', 'location.href = ' + location.href);
    H(typeof jsyaml !== 'undefined', 'js-yaml loaded', 'js-yaml is NOT loaded');

    fetch('fetchfolio.config.yaml', { cache: 'no-cache' })
      .then(res => {
        H(res.ok, 'config.yaml fetch: HTTP ' + res.status, 'config.yaml fetch FAILED: HTTP ' + res.status);
        return res.text();
      })
      .then(text => {
        try {
          const cfg = jsyaml.load(text, { json: true });
          line('', 'parsed = ' + JSON.stringify(cfg));
          H(cfg && cfg.site && cfg.site.user, 'config parsed fine — site.user = "' + (cfg.site.user || 'EMPTY') + '", host = "' + (cfg.site.host || 'EMPTY') + '"', 'config parsed but site.user/host missing');
        } catch (e) {
          line('err', 'YAML PARSE ERROR -> ' + e.message);
        }
        setTimeout(() => {
          H(document.title.indexOf('user@') === -1 || true, 'page title now: "' + document.title + '" (config.js should have rewritten the prefix)');
          line('warn', 'If [FAIL] above did not appear but the title is still "user@hostname:~/", press Ctrl+Shift+R once more on this debug page.');
        }, 1200);
      })
      .catch(e => line('err', 'fetch threw -> ' + e));
  } catch (e) {
    line('err', 'script error -> ' + e);
  }
})();
</script>
</body>
</html>
