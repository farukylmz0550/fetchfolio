# FetchFolio — nginx site config (Dockerfile ile kullanılır)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Eksik yollar terminal temalı 404'e düşer
    error_page 404 /404.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Markdown + YAML + statik varlıklar için cache başlıkları
    location ~* \.(css|js|svg|ico|png|jpg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
    location ~* \.(md|yaml)$ {
        expires 5m;
        add_header Cache-Control "public";
    }

    # / şeklinde biten yollar index'e, diğerleri doğrudan dosyaya
    location / {
        try_files $uri $uri/ =404;
    }
}
