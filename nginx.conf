# FetchFolio — nginx site config (used with the Dockerfile)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The whole site (content, config, comments) is UTF-8 — declare it on the
    # wire too, not only in the <meta charset> tag.
    charset utf-8;

    # Missing paths fall through to the terminal-themed 404
    error_page 404 /404.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/ld+json application/xml image/svg+xml;
    gzip_min_length 512;

    # Serve HTML as UTF-8 and block MIME sniffing on every response.
    add_header X-Content-Type-Options "nosniff" always;

    # SEO files: public, but revalidated quickly so an updated sitemap or
    # robots.txt goes live without waiting for a long cache window.
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cache headers for markdown, YAML and static assets
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp|txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(md|yaml)$ {
        expires 5m;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Redirects stay relative so they keep the visitor's scheme: behind a TLS
    # proxy $scheme is http, and an absolute Location would downgrade https.
    absolute_redirect off;

    # Flat URLs: /src/pages/x.html -> /x and /x.html -> /x (one canonical URL).
    # 404.html is excluded: error_page points at it, and a redirect there would
    # turn the 404 status into a 301 + 200 chain.
    #
    # /index.html -> / is keyed on $request_uri, not the location: the `index`
    # directive internally maps "/" to /index.html, so a plain `location =
    # /index.html { return 301 /; }` would bounce every "/" request forever.
    location = /index.html {
        if ($request_uri = /index.html) {
            return 301 /;
        }
        try_files /index.html =404;
    }
    location ~ ^/src/pages/(.+)\.html$ {
        return 301 /$1;
    }
    location ~ ^/(?!404\.html)(.+)\.html$ {
        return 301 /$1;
    }

    # Paths ending in / resolve to index; /cv serves cv.html (flat URLs, no
    # .html in the address bar). The literal file always wins, so /cv.html
    # and the 404 page keep working.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
