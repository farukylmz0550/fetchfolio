# FetchFolio — nginx site config (used with the Dockerfile)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing paths fall through to the terminal-themed 404
    error_page 404 /404.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Cache headers for markdown, YAML and static assets
    location ~* \.(css|js|svg|ico|png|jpg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
    location ~* \.(md|yaml)$ {
        expires 5m;
        add_header Cache-Control "public";
    }

    # Paths ending in / resolve to index, anything else to the file
    location / {
        try_files $uri $uri/ =404;
    }
}
