  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "name": "CV & Skills — Your Name | Resume",
    "url": "https://example.com/cv",
    "inLanguage": "en",
    "isPartOf": { "@id": "https://example.com/#website" },
    "mainEntity": {
      "@id": "https://example.com/#person",
      "@type": "Person",
      "knowsAbout": ["Linux", "Git", "Docker", "Raspberry Pi", "PCB Design", "3D Printing"]
    },
    "breadcrumb": {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://example.com/" },
        { "@type": "ListItem", "position": 2, "name": "CV", "item": "https://example.com/cv" }
      ]
    }
  }
  </script>
</head>
<body class="page">
<a class="skip-link" href="#main">Skip to content</a>

  <div class="terminal-window">
    <div class="terminal-bar">
      <div class="terminal-dot dot-red"></div>
      <div class="terminal-dot dot-yellow"></div>
      <div class="terminal-dot dot-green"></div>
      <span class="terminal-title">user@hostname:~/cv</span>
    </div>
    <main class="terminal-body" id="main">
      <div><span class="prompt">$</span> <span class="cmd">cat cv.md</span><span class="cursor"></span></div>
      <!-- The block between the markers is generated by scripts/prerender.py
           so crawlers and no-JS visitors get real HTML; load-md.js re-renders
           the same markup with marked.js on load. -->
      <article id="content"><!-- prerender:content/cv.md:start --><h1>CV / Resume</h1>
<h2>Work Experience</h2>
<ul>
<li>[your work experience]</li>
</ul>
<h2>Technical Skills</h2>
<p><strong>Operating Systems</strong> : [os list]</p>
<p><strong>Tools &amp; Technologies</strong> : [tools]</p>
<p><strong>Programming Languages</strong> : [languages]</p>
<p><strong>Other</strong> : [other skills]</p>
<h2>Certificates</h2>
<ul>
<li>[certificate 1]</li>
</ul>
<!-- prerender:content/cv.md:end --></article>
      <a href="/" class="back-link">&lt; cd ~</a>
    </main>
  </div>

  <script src="/src/js/js-yaml.min.js"></script>
  <script src="/src/js/config.js?v=9"></script>
  <script src="/src/js/marked.min.js"></script>
  <script src="/src/js/load-md.js?v=8"></script>
  <script>loadMarkdown('/content/cv.md');</script>
</body>
</html>
