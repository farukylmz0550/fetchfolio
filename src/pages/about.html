<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>user@hostname:~/hakkimda</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body class="page">
<a class="skip-link" href="#main">İçeriğe atla</a>

  <div class="terminal-window">
    <div class="terminal-bar">
      <div class="terminal-dot dot-red"></div>
      <div class="terminal-dot dot-yellow"></div>
      <div class="terminal-dot dot-green"></div>
      <span class="terminal-title">user@hostname:~/hakkimda</span>
      <button class="lang-btn" onclick="toggleLang()" aria-label="Dili değiştir">TR</button>
    </div>
    <div class="terminal-body" id="main">
      <div><span class="prompt">$</span> <span class="cmd">cat hakkimda.md</span><span class="cursor"></span></div>
      <div id="content"></div>
      <a href="../../index.html" class="back-link">&lt; cd ~</a>
    </div>
  </div>

  <script src="../../src/js/js-yaml.min.js"></script>
  <script src="../../src/js/config.js"></script>
  <script src="../../src/js/marked.min.js"></script>
  <script src="../../src/js/i18n.js"></script>
  <script src="../../src/js/load-md.js"></script>
  <script>
    loadMarkdown('../../content/about.md');

    function toggleLang() {
      const newLang = getLang() === 'tr' ? 'en' : 'tr';
      setLang(newLang);
      document.querySelector('.lang-btn').textContent = newLang.toUpperCase();
      document.title = getUserHostPrefix() + ':' + t('titles.about');
      document.querySelector('.terminal-title').textContent = getUserHostPrefix() + ':' + t('titles.about');
      document.querySelector('.cmd').textContent = t('pages.about');
      loadMarkdown('../../content/about.md');
    }

    document.querySelector('.lang-btn').textContent = getLang().toUpperCase();
    document.querySelector('.cmd').textContent = t('pages.about');
    document.title = getUserHostPrefix() + ':' + t('titles.about');
  </script>
</body>
</html>
